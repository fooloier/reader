[package]
name = "reader"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/core", "crates/runtime"]
exclude = ["vendor/gpui-pdf"]
resolver = "2"

[features]
test-support = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = "=0.9.1"
gpui-pdf = { path = "vendor/gpui-pdf", features = ["markup"] }
reader-core = { path = "crates/core" }
reader-runtime = { path = "crates/runtime" }
anyhow = "1"
serde_json = "1"
futures = "0.3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

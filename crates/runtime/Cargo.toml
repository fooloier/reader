[package]
name = "reader-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
reader-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
directories = "6"
sha2 = "0.10"
rbook = { version = "=0.7.13", default-features = false, features = ["threadsafe"] }
hayro = "0.8"
roxmltree = "0.21"
markup5ever = "0.12.1"
image = "0.25"
futures = "0.3"
fs2 = "0.4"
percent-encoding = "2"

[dev-dependencies]
markdown = "1.0.0"
